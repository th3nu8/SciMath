<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SciMath – Science &amp; Math Games</title>
  <style>
    /* ── Reset & variables ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #050a14;
      --bg-card:    #0d1b2a;
      --bg-card-h:  #122236;
      --accent:     #00d4ff;
      --accent2:    #7b2fff;
      --accent3:    #00ff99;
      --text:       #d0e8ff;
      --text-muted: #6a8ba8;
      --border:     rgba(0, 212, 255, 0.18);
      --radius:     12px;
      --glow:       0 0 18px rgba(0, 212, 255, 0.35);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Starfield background ──────────────────────────────────────────── */
    #starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      animation: twinkle var(--dur, 4s) var(--delay, 0s) infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50%       { opacity: var(--peak, 0.7); }
    }

    /* ── Layout ────────────────────────────────────────────────────────── */
    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      text-align: center;
      padding: 60px 20px 40px;
    }
    .logo-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: var(--glow), inset 0 0 20px rgba(0, 212, 255, 0.15);
      margin-bottom: 20px;
      animation: pulse-ring 3s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: var(--glow), inset 0 0 20px rgba(0, 212, 255, 0.15); }
      50%       { box-shadow: 0 0 30px rgba(0, 212, 255, 0.6), inset 0 0 30px rgba(0, 212, 255, 0.25); }
    }
    .logo-ring svg { width: 48px; height: 48px; }

    header h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── Section heading ───────────────────────────────────────────────── */
    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .section-heading h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .section-heading::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    /* ── Game grid ─────────────────────────────────────────────────────── */
    #game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    /* ── Game card ─────────────────────────────────────────────────────── */
    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      text-decoration: none;
      color: inherit;
    }
    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0, 212, 255, 0.2);
      border-color: var(--accent);
      background: var(--bg-card-h);
    }

    .card-icon {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: linear-gradient(135deg, #0a1929, #1a0a40);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-icon.no-image {
      font-size: 4.5rem;
      line-height: 1;
      padding: 28px 0;
    }

    .card-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
      flex: 1;
    }
    .card-play {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 8px 16px;
      border-radius: 6px;
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(123,47,255,0.15));
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: background 0.2s, box-shadow 0.2s;
      align-self: flex-start;
    }
    .game-card:hover .card-play {
      background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(123,47,255,0.3));
      box-shadow: 0 0 12px rgba(0,212,255,0.3);
    }

    /* ── Loading / error states ────────────────────────────────────────── */
    #status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    #status.error { color: #ff6b6b; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ────────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 32px 20px;
      color: var(--text-muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    /* ── Responsive tweaks ─────────────────────────────────────────────── */
    @media (max-width: 480px) {
      header { padding: 40px 16px 28px; }
      #game-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Starfield -->
<div id="starfield" aria-hidden="true"></div>

<div class="page-wrap">
  <header>
    <div class="logo-ring">
      <!-- Atom icon -->
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#00d4ff" stroke-width="2"/>
        <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#7b2fff" stroke-width="2"
                 transform="rotate(60 24 24)"/>
        <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#00ff99" stroke-width="2"
                 transform="rotate(120 24 24)"/>
        <circle cx="24" cy="24" r="3.5" fill="#00d4ff"/>
      </svg>
    </div>
    <h1>SciMath</h1>
    <p>Explore the universe of science &amp; mathematics through interactive games. Pick a game and launch your mind into orbit.</p>
  </header>

  <main class="page-wrap">
    <div class="section-heading">
      <h2>&#9654; Game Deck</h2>
    </div>

    <div id="game-grid" role="list" aria-label="Available games">
      <div id="status">
        <div class="spinner"></div>
        <p>Scanning for games…</p>
      </div>
    </div>
  </main>
</div>

<footer>
  <p>SciMath &mdash; Science &amp; Mathematics Gaming Platform &mdash; Add games to the <code>games/</code> folder to expand the deck.</p>
</footer>

<script>
  /* ── Starfield ───────────────────────────────────────────────────────── */
  (function buildStarfield() {
    const sf = document.getElementById('starfield');
    const count = Math.min(200, Math.floor((window.innerWidth * window.innerHeight) / 4000));
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = [
        `width:${size}px`, `height:${size}px`,
        `left:${Math.random() * 100}%`, `top:${Math.random() * 100}%`,
        `--dur:${(Math.random() * 5 + 2).toFixed(1)}s`,
        `--delay:${(Math.random() * 6).toFixed(1)}s`,
        `--peak:${(Math.random() * 0.6 + 0.2).toFixed(2)}`
      ].join(';');
      frag.appendChild(s);
    }
    sf.appendChild(frag);
  })();

  /* ── Utility: humanise a filename ────────────────────────────────────── */
  function humanise(name) {
    return name
      .replace(/[-_]/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  /* ── Render a single game card ───────────────────────────────────────── */
  function renderCard(game) {
    const card = document.createElement('a');
    card.className = 'game-card';
    card.href = game.path;
    card.setAttribute('role', 'listitem');
    card.setAttribute('aria-label', `Play ${game.title}`);

    // Icon area
    const iconWrap = document.createElement('div');
    iconWrap.className = 'card-icon';

    if (game.icon) {
      const img = document.createElement('img');
      img.src = game.icon;
      img.alt = `${game.title} icon`;
      img.loading = 'lazy';
      img.onerror = () => {
        iconWrap.classList.add('no-image');
        iconWrap.removeChild(img);
        iconWrap.textContent = game.emoji || '🔬';
      };
      iconWrap.appendChild(img);
    } else {
      iconWrap.classList.add('no-image');
      iconWrap.textContent = game.emoji || '🔬';
    }

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = game.title;

    const desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.textContent = game.description || 'Launch this game and explore!';

    const play = document.createElement('div');
    play.className = 'card-play';
    play.innerHTML = '&#9654; Play Now';

    body.append(title, desc, play);
    card.append(iconWrap, body);
    return card;
  }

  /* ── Main: load games.json and populate grid ─────────────────────────── */
  async function loadGames() {
    const grid = document.getElementById('game-grid');
    const status = document.getElementById('status');

    let manifest;
    try {
      const res = await fetch('games.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      manifest = await res.json();
    } catch (err) {
      status.classList.add('error');
      status.innerHTML = `<p>⚠️ Could not load game manifest (<code>games.json</code>).<br>
        Make sure <code>games.json</code> exists and the page is served over HTTP.</p>`;
      console.error('SciMath: failed to load games.json', err);
      return;
    }

    grid.removeChild(status);

    if (!Array.isArray(manifest) || manifest.length === 0) {
      grid.innerHTML = `<div id="status"><p>No games found yet. Add game files to the <code>games/</code> folder and update <code>games.json</code>.</p></div>`;
      return;
    }

    // Build icon lookup: name → url (tries .png then .jpg)
    // The manifest may supply icon paths directly; if not, we derive them.
    const frag = document.createDocumentFragment();
    for (const game of manifest) {
      // Derive icon path if not provided
      if (!game.icon) {
        // icon name matches game id (folder/file name without extension)
        game.icon = `icons/${game.id}.png`;
      }
      if (!game.path) {
        // Assume folder-based game with index.html, or single .html file
        game.path = `games/${game.id}/index.html`;
      }
      frag.appendChild(renderCard(game));
    }
    grid.appendChild(frag);
  }

  loadGames();
</script>
</body>
</html>
