<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a14"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00ff99"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <!-- Periodic table squares -->
  <rect x="30" y="40" width="50" height="50" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <text x="55" y="62" font-family="monospace" font-size="18" font-weight="bold" fill="#00d4ff" text-anchor="middle">H</text>
  <text x="55" y="78" font-family="sans-serif" font-size="9" fill="#6a8ba8" text-anchor="middle">1</text>
  <rect x="90" y="40" width="50" height="50" rx="6" fill="none" stroke="#7b2fff" stroke-width="1.5" opacity="0.4"/>
  <text x="115" y="62" font-family="monospace" font-size="18" font-weight="bold" fill="#7b2fff" text-anchor="middle">He</text>
  <text x="115" y="78" font-family="sans-serif" font-size="9" fill="#6a8ba8" text-anchor="middle">2</text>
  <rect x="30" y="100" width="50" height="50" rx="6" fill="none" stroke="#00ff99" stroke-width="1.5" opacity="0.4"/>
  <text x="55" y="122" font-family="monospace" font-size="18" font-weight="bold" fill="#00ff99" text-anchor="middle">Fe</text>
  <text x="55" y="138" font-family="sans-serif" font-size="9" fill="#6a8ba8" text-anchor="middle">26</text>
  <rect x="90" y="100" width="50" height="50" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
  <text x="115" y="122" font-family="monospace" font-size="18" font-weight="bold" fill="#00d4ff" text-anchor="middle">Au</text>
  <text x="115" y="138" font-family="sans-serif" font-size="9" fill="#6a8ba8" text-anchor="middle">79</text>
  <!-- Title area -->
  <text x="220" y="90" font-family="sans-serif" font-size="28" font-weight="bold" fill="url(#accent)" text-anchor="middle">⚗️</text>
  <text x="220" y="130" font-family="sans-serif" font-size="22" font-weight="bold" fill="#d0e8ff" text-anchor="middle">Element Quiz</text>
  <text x="220" y="155" font-family="sans-serif" font-size="12" fill="#6a8ba8" text-anchor="middle">Test your periodic table knowledge</text>
  <!-- Border glow -->
  <rect width="400" height="225" rx="8" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>
</svg>