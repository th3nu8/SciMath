<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a14"/>
      <stop offset="100%" style="stop-color:#1a0a05"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:0.2"/>
    </radialGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg2)"/>
  <!-- Reactor core circles -->
  <circle cx="80" cy="112" r="55" fill="none" stroke="#ff4444" stroke-width="1.5" opacity="0.3"/>
  <circle cx="80" cy="112" r="40" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>
  <circle cx="80" cy="112" r="25" fill="url(#core)" opacity="0.6"/>
  <text x="80" y="120" font-family="sans-serif" font-size="22" fill="#ff6b35" text-anchor="middle" opacity="0.9">⚛️</text>
  <!-- Math equations -->
  <text x="220" y="70" font-family="monospace" font-size="16" fill="#00d4ff" text-anchor="middle" opacity="0.6">7 × 8 = ?</text>
  <text x="220" y="95" font-family="monospace" font-size="16" fill="#7b2fff" text-anchor="middle" opacity="0.5">144 ÷ 12 = ?</text>
  <!-- Title -->
  <text x="220" y="135" font-family="sans-serif" font-size="22" font-weight="bold" fill="#d0e8ff" text-anchor="middle">Math Reactor</text>
  <text x="220" y="158" font-family="sans-serif" font-size="12" fill="#6a8ba8" text-anchor="middle">Solve fast — prevent meltdown!</text>
  <!-- Heat bar -->
  <rect x="155" y="175" width="130" height="8" rx="4" fill="rgba(255,68,68,0.15)" stroke="rgba(255,68,68,0.3)" stroke-width="1"/>
  <rect x="155" y="175" width="65" height="8" rx="4" fill="#ff6b35" opacity="0.7"/>
  <text x="220" y="200" font-family="sans-serif" font-size="10" fill="#6a8ba8" text-anchor="middle">⚠ Reactor Heat</text>
  <!-- Border -->
  <rect width="400" height="225" rx="8" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.2"/>
</svg>